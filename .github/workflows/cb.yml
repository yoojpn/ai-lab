name: cb
# CB群: 数え上げ+SVDで作る言語モデル(座標・Attention相当・回路の自動探索)。 16M語、 WikiText-103。 密モデルの基準(5.55/5.12/4.87)と同じ土台
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cb_2M
            cfg: '{"N":2000000,"ntune":2500,"ntest":20000}'
          - name: cb_4M
            cfg: '{"N":4000000,"ntune":2500,"ntest":20000}'
          - name: cb_8M
            cfg: '{"N":8000000,"ntune":2500,"ntest":20000}'
          - name: cb_16M
            cfg: '{"N":16000000,"ntune":2500,"ntest":20000}'
          - name: cb_45M
            cfg: '{"N":45000000,"ntune":2500,"ntest":20000}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas pyarrow scipy torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - run: python3 hdc/prep_wikitext.py 45000000 $RUNNER_TEMP/wt.pkl
      - name: run
        working-directory: hdc
        shell: bash
        run: LADDER_CORPUS=$RUNNER_TEMP/wt.pkl python3 exp_cb.py '${{ matrix.cfg }}' | tee ../out.log
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out.log
