name: hy
# HY: 表(CB2) + 小さな骨格(座標+位置束プーリング+ランダムReLU層、最小二乗の読み出し)。 賢さ・推論MAC・学習を、密LLMと並べる
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: hy_16M
            cfg: '{"N":16000000,"ntune":4000,"ntest":20000,"nfit":1500000}'
          - name: hy_45M
            cfg: '{"N":45000000,"ntune":4000,"ntest":20000,"nfit":2000000}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas pyarrow scipy torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - run: python3 hdc/prep_wikitext.py 45000000 $RUNNER_TEMP/wt.pkl
      - name: run
        working-directory: hdc
        shell: bash
        run: LADDER_CORPUS=$RUNNER_TEMP/wt.pkl python3 exp_hy.py '${{ matrix.cfg }}' | tee ../out.log
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out.log
