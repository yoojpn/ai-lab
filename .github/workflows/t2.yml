name: t2
# T2群: 普通のLLMの学び方(全位置を学習)の小さなTransformer。実測時間 vs bit/語。
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: q1_16M_d128l2_ep3
            corpus: wt
            cfg: '{"N":16000000,"d":128,"nl":2,"epochs":3}'
          - name: q2_16M_d128l2_ep10
            corpus: wt
            cfg: '{"N":16000000,"d":128,"nl":2,"epochs":10}'
          - name: q3_16M_d256l4_ep3
            corpus: wt
            cfg: '{"N":16000000,"d":256,"nl":4,"epochs":3}'
          - name: q4_16M_d192l3_ep3
            corpus: wt
            cfg: '{"N":16000000,"d":192,"nl":3,"epochs":3}'
          - name: q5_40M_d128l2_ep3
            corpus: wt
            cfg: '{"N":40000000,"d":128,"nl":2,"epochs":3}'
          - name: q6_40M_d128l2_ep5
            corpus: wt
            cfg: '{"N":40000000,"d":128,"nl":2,"epochs":5}'
          - name: q7_40M_d256l4_ep1
            corpus: wt
            cfg: '{"N":40000000,"d":256,"nl":4,"epochs":1}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas pyarrow scipy torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - if: matrix.corpus == 'wt'
        run: python3 hdc/prep_wikitext.py 45000000 $RUNNER_TEMP/wt.pkl
      - name: run
        working-directory: hdc
        shell: bash
        run: |
          if [ "${{ matrix.corpus }}" = "wt" ]; then LADDER_CORPUS=$RUNNER_TEMP/wt.pkl python3 exp_t2.py '${{ matrix.cfg }}' | tee ../out.log
          elif [ "${{ matrix.corpus }}" = "code" ]; then LADDER_CORPUS=$RUNNER_TEMP/code.pkl python3 exp_t2.py '${{ matrix.cfg }}' | tee ../out.log
          else python3 exp_k.py | tee ../out.log; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out.log
