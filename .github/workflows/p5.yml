name: p5
# P群 第5陣: 検索を学習に組み込む(RNet) 対 事後混合。カーネルリッジ重みの試験も含む。
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas pyarrow scipy faiss-cpu torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - run: python3 hdc/prep_wikitext.py 64000000 $RUNNER_TEMP/wt.pkl
      - name: p9
        working-directory: hdc
        shell: bash
        run: LADDER_CORPUS=$RUNNER_TEMP/wt.pkl python3 exp_p.py p9 4000000 32000000 | tee ../out.log
      - uses: actions/upload-artifact@v4
        with:
          name: p5-out
          path: out.log
