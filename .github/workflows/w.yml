name: w
# I群: 勾配ゼロで「教えていないこと」を引き出す20実験(文献: infini-gram, n-gram heads/induction)。
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: w1_base40
            corpus: wt
            script: exp_w.py
            cfg: '{"N":40000000,"epochs":1.2}'
          - name: w2_loop1x4
            corpus: wt
            script: exp_w.py
            cfg: '{"N":40000000,"epochs":1.2,"loop":1}'
          - name: w3_loop2x2
            corpus: wt
            script: exp_w.py
            cfg: '{"N":40000000,"epochs":1.2,"loop":2}'
          - name: w4_tst_bag4
            corpus: wt
            script: exp_w.py
            cfg: '{"N":40000000,"epochs":1.2,"bag":4,"frac":0.5}'
          - name: w5_tst_bag2
            corpus: wt
            script: exp_w.py
            cfg: '{"N":40000000,"epochs":1.2,"bag":2,"frac":0.5}'
          - name: w6_dyck10
            corpus: wt
            script: exp_w.py
            cfg: '{"N":40000000,"epochs":1.2,"fl":0.1}'
          - name: w7_dyck20
            corpus: wt
            script: exp_w.py
            cfg: '{"N":40000000,"epochs":1.2,"fl":0.2}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas pyarrow scipy torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - if: matrix.corpus == 'wt'
        run: python3 hdc/prep_wikitext.py 45000000 $RUNNER_TEMP/wt.pkl
      - name: run
        working-directory: hdc
        shell: bash
        run: |
          if [ "${{ matrix.corpus }}" = "wt" ]; then LADDER_CORPUS=$RUNNER_TEMP/wt.pkl python3 ${{ matrix.script }} '${{ matrix.cfg }}' | tee ../out.log
          else LADDER_CORPUS=$RUNNER_TEMP/code.pkl python3 ${{ matrix.script }} '${{ matrix.cfg }}' | tee ../out.log; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out.log
