name: t3
# T3群: 文脈長128語の、普通のLLMの学び方の小さなTransformer(数える方式の文書内の引きと公平に比べる)。実測時間 vs bit/語。
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: u1_16M_d128l2_ep3_s128
            corpus: wt
            cfg: '{"N":16000000,"d":128,"nl":2,"epochs":3,"seq":128}'
          - name: u2_40M_d128l2_ep3_s128
            corpus: wt
            cfg: '{"N":40000000,"d":128,"nl":2,"epochs":3,"seq":128}'
          - name: u3_40M_d256l4_ep1_s128
            corpus: wt
            cfg: '{"N":40000000,"d":256,"nl":4,"epochs":1,"seq":128}'
          - name: u4_40M_d256l4_ep2_s128
            corpus: wt
            cfg: '{"N":40000000,"d":256,"nl":4,"epochs":2,"seq":128}'
          - name: u5_16M_d256l4_ep3_s128
            corpus: wt
            cfg: '{"N":16000000,"d":256,"nl":4,"epochs":3,"seq":128}'
          - name: u6_40M_d192l3_ep3_s128
            corpus: wt
            cfg: '{"N":40000000,"d":192,"nl":3,"epochs":3,"seq":128}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas pyarrow scipy torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - if: matrix.corpus == 'wt'
        run: python3 hdc/prep_wikitext.py 45000000 $RUNNER_TEMP/wt.pkl
      - name: run
        working-directory: hdc
        shell: bash
        run: |
          if [ "${{ matrix.corpus }}" = "wt" ]; then LADDER_CORPUS=$RUNNER_TEMP/wt.pkl python3 exp_t3.py '${{ matrix.cfg }}' | tee ../out.log
          elif [ "${{ matrix.corpus }}" = "code" ]; then LADDER_CORPUS=$RUNNER_TEMP/code.pkl python3 exp_t3.py '${{ matrix.cfg }}' | tee ../out.log
          else python3 exp_k.py | tee ../out.log; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out.log
