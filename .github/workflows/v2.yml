name: v2
# 第2版(M1)の測定。構成ごとにジョブを分けて並列。
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        include:
          - {n: 4000000, v: base}
          - {n: 4000000, v: ppmi}
          - {n: 4000000, v: ppmi_head}
          - {n: 4000000, v: full}
          - {n: 16000000, v: full}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas pyarrow scipy torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - run: python3 hdc/prep_wikitext.py ${{ matrix.n }} $RUNNER_TEMP/wt.pkl
      - name: 測定
        working-directory: hdc
        shell: bash
        run: LADDER_CORPUS=$RUNNER_TEMP/wt.pkl python3 exp_v2.py ${{ matrix.n }} ${{ matrix.v }} | tee ../out.log
      - uses: actions/upload-artifact@v4
        with:
          name: v2-${{ matrix.n }}-${{ matrix.v }}
          path: out.log
