name: cb2
# CB2群: 伸びの鈍りを直す部品(高次n-gram, 飛び越し, クラスn-gram, キャッシュ, ゲート)。 データ量 4M/16M/45M で傾きを測る
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cb2_4M
            cfg: '{"N":4000000,"ntune":4000,"ntest":20000}'
          - name: cb2_16M
            cfg: '{"N":16000000,"ntune":4000,"ntest":20000}'
          - name: cb2_45M
            cfg: '{"N":45000000,"ntune":4000,"ntest":20000}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas pyarrow scipy torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - run: python3 hdc/prep_wikitext.py 45000000 $RUNNER_TEMP/wt.pkl
      - name: run
        working-directory: hdc
        shell: bash
        run: LADDER_CORPUS=$RUNNER_TEMP/wt.pkl python3 exp_cb2.py '${{ matrix.cfg }}' | tee ../out.log
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out.log
