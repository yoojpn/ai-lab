name: g
# G群 (H6): 索引(kNN-LM)は学習なしでパラメータの代わりになるか。幅d=64/128/256 x 索引サイズ T=0.25M/1M/4M
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: g_knn_d64
            corpus: wt
            script: exp_knn.py
            cfg: '{"N":16000000,"d":64,"epochs":2,"Tmax":4000000,"Ts":[250000,1000000,4000000]}'
            r: ''
          - name: g_knn_d128
            corpus: wt
            script: exp_knn.py
            cfg: '{"N":16000000,"d":128,"epochs":2,"Tmax":4000000,"Ts":[250000,1000000,4000000]}'
            r: ''
          - name: g_knn_d256
            corpus: wt
            script: exp_knn.py
            cfg: '{"N":16000000,"d":256,"epochs":2,"Tmax":4000000,"Ts":[250000,1000000,4000000]}'
            r: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas pyarrow scipy torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - if: matrix.corpus == 'wt' || matrix.corpus == 'mix'
        run: python3 hdc/prep_wikitext.py 45000000 $RUNNER_TEMP/wt.pkl
      - if: matrix.corpus == 'mix'
        run: python3 hdc/make_mix.py $RUNNER_TEMP/wt.pkl $RUNNER_TEMP/mix.pkl ${{ matrix.r }} 16000000
      - name: run
        working-directory: hdc
        shell: bash
        run: |
          if [ "${{ matrix.corpus }}" = "mix" ]; then LADDER_CORPUS=$RUNNER_TEMP/mix.pkl python3 ${{ matrix.script }} '${{ matrix.cfg }}' | tee ../out.log
          else LADDER_CORPUS=$RUNNER_TEMP/wt.pkl python3 ${{ matrix.script }} '${{ matrix.cfg }}' | tee ../out.log; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out.log
