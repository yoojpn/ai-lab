name: d
# I群: 勾配ゼロで「教えていないこと」を引き出す20実験(文献: infini-gram, n-gram heads/induction)。
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: d1_gen
            corpus: wt
            script: exp_h.py
            cfg: '{"N":16000000,"main":4,"nq":3000}'
          - name: d2_hash100M
            corpus: wt
            script: exp_hash.py
            cfg: '{"N":45000000}'
          - name: d3_code_c
            corpus: code
            script: exp_i.py
            cfg: '{"N":3000000,"main":5,"ngh2":1,"far":1,"trig":1,"rfr_D":1024}'
          - name: d4_wt40_c
            corpus: wt
            script: exp_i.py
            cfg: '{"N":40000000,"main":5,"ngh2":1,"far":1,"trig":1,"rfr_D":2048}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas pyarrow scipy torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - if: matrix.corpus == 'wt'
        run: python3 hdc/prep_wikitext.py 45000000 $RUNNER_TEMP/wt.pkl
      - name: run
        working-directory: hdc
        shell: bash
        run: |
          if [ "${{ matrix.corpus }}" = "wt" ]; then LADDER_CORPUS=$RUNNER_TEMP/wt.pkl python3 ${{ matrix.script }} '${{ matrix.cfg }}' | tee ../out.log
          else LADDER_CORPUS=$RUNNER_TEMP/code.pkl python3 ${{ matrix.script }} '${{ matrix.cfg }}' | tee ../out.log; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out.log
