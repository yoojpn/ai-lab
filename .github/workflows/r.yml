name: r
# I群: 勾配ゼロで「教えていないこと」を引き出す20実験(文献: infini-gram, n-gram heads/induction)。
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: r1_none_lr2
            corpus: wt
            script: exp_r.py
            cfg: '{"N":16000000,"d":128,"nl":4,"seq":64,"epochs":3,"lr":0.002,"prior":"none"}'
          - name: r2_bi_lr2
            corpus: wt
            script: exp_r.py
            cfg: '{"N":16000000,"d":128,"nl":4,"seq":64,"epochs":3,"lr":0.002,"prior":"bi"}'
          - name: r3_none_lr4
            corpus: wt
            script: exp_r.py
            cfg: '{"N":16000000,"d":128,"nl":4,"seq":64,"epochs":3,"lr":0.004,"prior":"none"}'
          - name: r4_bi_lr4
            corpus: wt
            script: exp_r.py
            cfg: '{"N":16000000,"d":128,"nl":4,"seq":64,"epochs":3,"lr":0.004,"prior":"bi"}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas pyarrow scipy torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - if: matrix.corpus == 'wt'
        run: python3 hdc/prep_wikitext.py 45000000 $RUNNER_TEMP/wt.pkl
      - name: run
        working-directory: hdc
        shell: bash
        run: |
          if [ "${{ matrix.corpus }}" = "wt" ]; then LADDER_CORPUS=$RUNNER_TEMP/wt.pkl python3 ${{ matrix.script }} '${{ matrix.cfg }}' | tee ../out.log
          else LADDER_CORPUS=$RUNNER_TEMP/code.pkl python3 ${{ matrix.script }} '${{ matrix.cfg }}' | tee ../out.log; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out.log
