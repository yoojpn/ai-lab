name: p4
# P群 第4陣: 索引の検索を軽くする(分割+圧縮)。6400万語、1語16バイト。
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas pyarrow scipy faiss-cpu torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - run: python3 hdc/prep_wikitext.py 64000000 $RUNNER_TEMP/wt.pkl
      - name: p8
        working-directory: hdc
        shell: bash
        run: LADDER_CORPUS=$RUNNER_TEMP/wt.pkl python3 exp_p.py p8 4000000 64000000 | tee ../out.log
      - uses: actions/upload-artifact@v4
        with:
          name: p4-out
          path: out.log
