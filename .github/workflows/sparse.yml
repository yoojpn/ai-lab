name: sparse
# ③スパース活性: 動かす割合と精度。構成ごとにジョブを分けて並列。
on:
  workflow_dispatch:
    inputs:
      n:
        default: '2000000'
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        cfg: ['40 40','64 64','256 256','1024 1024','1024 64','1024 16','4096 4096','4096 128','4096 41','4096 16']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas pyarrow scipy torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - run: python3 hdc/prep_wikitext.py ${{ inputs.n }} $RUNNER_TEMP/wt.pkl
      - name: 実験
        working-directory: hdc
        shell: bash
        run: LADDER_CORPUS=$RUNNER_TEMP/wt.pkl python3 exp_sparse.py ${{ inputs.n }} ${{ matrix.cfg }} 1 | tee ../out.log
      - uses: actions/upload-artifact@v4
        with:
          name: out-${{ strategy.job-index }}
          path: out.log
