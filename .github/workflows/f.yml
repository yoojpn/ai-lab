name: f
# F群: 勾配ゼロのモデル(数える+文書内キャッシュ+索引、重みだけEM)。学習の計算量が桁違いに小さいときの品質。
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        n: [4000000, 16000000]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas pyarrow scipy torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - run: python3 hdc/prep_wikitext.py 20000000 $RUNNER_TEMP/wt.pkl
      - name: f1
        working-directory: hdc
        shell: bash
        run: LADDER_CORPUS=$RUNNER_TEMP/wt.pkl python3 exp_f.py f1 ${{ matrix.n }} 20000 | tee ../out.log
      - uses: actions/upload-artifact@v4
        with:
          name: f-${{ matrix.n }}
          path: out.log
