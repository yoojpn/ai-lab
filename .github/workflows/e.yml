name: e
# E群: (A)表メモリ(PKM)の利得は幅で縮むか / (C)易しい語の割合 / (D)層出力の局所安定性
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: e_dense_d64
            corpus: wt
            script: exp_y.py
            cfg: '{"N":16000000,"d":64,"epochs":2,"ffn":"dense"}'
            r: ''
          - name: e_pkm_d64
            corpus: wt
            script: exp_y.py
            cfg: '{"N":16000000,"d":64,"epochs":2,"ffn":"pkm"}'
            r: ''
          - name: e_dense_d128
            corpus: wt
            script: exp_y.py
            cfg: '{"N":16000000,"d":128,"epochs":2,"ffn":"dense"}'
            r: ''
          - name: e_pkm_d128
            corpus: wt
            script: exp_y.py
            cfg: '{"N":16000000,"d":128,"epochs":2,"ffn":"pkm"}'
            r: ''
          - name: e_dense_d256
            corpus: wt
            script: exp_y.py
            cfg: '{"N":16000000,"d":256,"epochs":2,"ffn":"dense"}'
            r: ''
          - name: e_pkm_d256
            corpus: wt
            script: exp_y.py
            cfg: '{"N":16000000,"d":256,"epochs":2,"ffn":"pkm"}'
            r: ''
          - name: e_dense_d512
            corpus: wt
            script: exp_y.py
            cfg: '{"N":16000000,"d":512,"epochs":2,"ffn":"dense"}'
            r: ''
          - name: e_pkm_d512
            corpus: wt
            script: exp_y.py
            cfg: '{"N":16000000,"d":512,"epochs":2,"ffn":"pkm"}'
            r: ''
          - name: e_cd_d128
            corpus: wt
            script: exp_cd.py
            cfg: '{"N":16000000,"d":128,"epochs":3}'
            r: ''
          - name: e_cd_d256
            corpus: wt
            script: exp_cd.py
            cfg: '{"N":16000000,"d":256,"epochs":3}'
            r: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas pyarrow scipy torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - if: matrix.corpus == 'wt' || matrix.corpus == 'mix'
        run: python3 hdc/prep_wikitext.py 45000000 $RUNNER_TEMP/wt.pkl
      - if: matrix.corpus == 'mix'
        run: python3 hdc/make_mix.py $RUNNER_TEMP/wt.pkl $RUNNER_TEMP/mix.pkl ${{ matrix.r }} 16000000
      - name: run
        working-directory: hdc
        shell: bash
        run: |
          if [ "${{ matrix.corpus }}" = "mix" ]; then LADDER_CORPUS=$RUNNER_TEMP/mix.pkl python3 ${{ matrix.script }} '${{ matrix.cfg }}' | tee ../out.log
          else LADDER_CORPUS=$RUNNER_TEMP/wt.pkl python3 ${{ matrix.script }} '${{ matrix.cfg }}' | tee ../out.log; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out.log
