name: hem
# EM: 次の語を予測しやすいように、文脈をグループに分け直す周回(勾配なし)。 対照: k-means(周回なし)
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas pyarrow scipy torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - run: python3 hdc/prep_wikitext.py 45000000 $RUNNER_TEMP/wt.pkl
      - name: run
        working-directory: hdc
        shell: bash
        run: LADDER_CORPUS=$RUNNER_TEMP/wt.pkl python3 exp_em.py '{"N":16000000,"K":1024,"nfit":800000,"km_iters":8,"em_iters":8,"ntune":4000,"ntest":20000}' | tee ../out.log
      - uses: actions/upload-artifact@v4
        with:
          name: hem
          path: out.log
