name: y
# I群: 勾配ゼロで「教えていないこと」を引き出す20実験(文献: infini-gram, n-gram heads/induction)。
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: y01_moe
            corpus: wt
            script: exp_y.py
            cfg: '{"N":16000000,"ffn":"moe"}'
          - name: y02_pkm
            corpus: wt
            script: exp_y.py
            cfg: '{"N":16000000,"ffn":"pkm"}'
          - name: y03_ret
            corpus: wt
            script: exp_y.py
            cfg: '{"N":16000000,"ret":1}'
          - name: y04_dedup_wt
            corpus: wt
            script: exp_y.py
            cfg: '{"N":16000000,"dedup":0.5}'
          - name: y05_code_base
            corpus: code
            script: exp_y.py
            cfg: '{"N":3000000}'
          - name: y06_code_dedup
            corpus: code
            script: exp_y.py
            cfg: '{"N":3000000,"dedup":0.5}'
          - name: y07_mup_d64
            corpus: wt
            script: exp_mup.py
            cfg: '{"N":8000000,"d":64,"nl":4}'
          - name: y08_mup_d128
            corpus: wt
            script: exp_mup.py
            cfg: '{"N":8000000,"d":128,"nl":4}'
          - name: y09_mup_d256
            corpus: wt
            script: exp_mup.py
            cfg: '{"N":8000000,"d":256,"nl":4}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas pyarrow scipy torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - if: matrix.corpus == 'wt'
        run: python3 hdc/prep_wikitext.py 45000000 $RUNNER_TEMP/wt.pkl
      - name: run
        working-directory: hdc
        shell: bash
        run: |
          if [ "${{ matrix.corpus }}" = "wt" ]; then LADDER_CORPUS=$RUNNER_TEMP/wt.pkl python3 ${{ matrix.script }} '${{ matrix.cfg }}' | tee ../out.log
          else LADDER_CORPUS=$RUNNER_TEMP/code.pkl python3 ${{ matrix.script }} '${{ matrix.cfg }}' | tee ../out.log; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out.log
